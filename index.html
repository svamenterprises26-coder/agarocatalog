<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --accent: #c9a87c;
  --accent-dark: #a88b5e;
  --text: #e8e6e3;
  --muted: #8b9bb4;
  --border: #2a3544;
  --success: #4ade80;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  background: #0f1419;
  border-bottom: 1px solid var(--border);
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-size: 1.2rem;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--accent);
}
.controls {
  padding: 1.5rem 2rem;
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: center;
  background: #121820;
  border-bottom: 1px solid var(--border);
}
.search-box, .filter-select {
  padding: 0.7rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.95rem;
}
.search-box { flex: 1; min-width: 200px; }
.filter-select { min-width: 180px; }
.stats {
  font-size: 0.85rem;
  color: var(--muted);
  margin-left: auto;
}
.products {
  padding: 2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}
.product-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
}

.product-img {
  height: 180px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.product-img img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
.product-img .placeholder {
  font-size: 3rem;
  color: var(--accent);
  display: none;
}

.product-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
}.product-info { padding: 1.2rem; }
.product-code {
  font-size: 0.7rem;
  letter-spacing: 1px;
  color: var(--accent);
  text-transform: uppercase;
}
.product-name {
  font-size: 1rem;
  font-weight: 500;
  margin: 0.4rem 0 0.8rem;
  line-height: 1.3;
}
.price-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 0.6rem;
}
.mrp {
  font-size: 0.8rem;
  color: var(--muted);
  text-decoration: line-through;
}
.dp {
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--success);
}
.meta {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 0.5rem;
  display: flex;
  gap: 0.8rem;
}
.badge {
  display: inline-block;
  background: rgba(201,168,124,0.15);
  color: var(--accent);
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-size: 0.7rem;
}
.category-tag {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 0.3rem;
}
footer {
  text-align: center;
  padding: 2rem;
  color: var(--muted);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>

function populateCategories() {
  const cats = [...new Set(PRODUCTS.map(p => p.category))].sort();
  const sel = document.getElementById("categoryFilter");
  cats.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function filterProducts() {
  const q = document.getElementById("search").value.toLowerCase();
  const cat = document.getElementById("categoryFilter").value;
  const filtered = PRODUCTS.filter(p => {
    const matchQ = p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
    const matchCat = cat === "all" || p.category === cat;
    return matchQ && matchCat;
  });
  renderProducts(filtered);
}

function renderProducts(list) {
  const container = document.getElementById("products");
  const stats = document.getElementById("stats");
  stats.textContent = list.length + " products";
  container.innerHTML = list.map(p => `
    <div class="product-card">
      <div class="product-img">
        <img src="images/${p.code}.jpg" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="placeholder" style="display:none; width:100%; height:100%; align-items:center; justify-content:center;">${categoryIcons[p.category] || "📦"}</div>
      </div>
      <div class="product-info">
        <div class="category-tag">${p.category}</div>
        <div class="product-code">${p.code}</div>
        <div class="product-name">${p.name}</div>
        <div class="price-row">
          <span class="mrp">MRP ₹${p.mrp.toLocaleString("en-IN")}</span>
          <span class="dp">DP ₹${p.rlp.toLocaleString("en-IN")}</span>
        </div>
        <div class="meta">
          <span>GST ${p.gst}</span>
          <span>${p.markdown}% off</span>
          ${p.bundle ? '<span class="badge">Bundle</span>' : ""}
        </div>
      </div>
    </div>
  `).join("");
}

window.onload = () => {
  populateCategories();
  renderProducts(PRODUCTS);
};
</script>
</body>
